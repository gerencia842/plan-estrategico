const CFG=window.PLAN_CONFIG||{};
let sb=null,me=null,role=null,saveTimer=null,saving=false,lastJSON="",readOnly=false,remotePending=null,offlineDirty=false,retryTimer=null;
let histList=null,deletedList=[],pendingImport=null,channel=null;
const SESSION=uid()+uid();let localRev=0;
const clone=o=>JSON.parse(JSON.stringify(o));
function stamp(d){d._by=SESSION;d._rev=++localRev;return d;}
const statusEl=document.getElementById("status"),statusT=document.getElementById("status-t");
function setStatus(s){statusEl.dataset.s=s;statusT.textContent={saved:"Guardado",saving:"Guardando…",offline:"Sin conexión · se guardará al reconectar",error:"No se pudo guardar",ro:"Solo lectura",loading:"Cargando…"}[s]||"";}
function saveDirty(){try{localStorage.setItem("pe-dirty",JSON.stringify({id:cur,email:me&&me.email,at:new Date().toISOString(),data:state}))}catch(e){}}
function clearDirty(){try{localStorage.removeItem("pe-dirty")}catch(e){}}

async function upsert(id,data){const {error}=await sb.from("planes").upsert({id,data});if(error)throw error;}
async function removeDoc(id){const {error}=await sb.from("planes").delete().eq("id",id);if(error)throw error;}
async function writeDoc(id,data){await upsert(id,stamp(data));}

function touch(){
  if(isRO()) return;
  years[cur]=clone(state);
  saveDirty();
  setStatus("saving"); clearTimeout(saveTimer); saveTimer=setTimeout(flush,700);
}
async function flush(){
  saveTimer=null; if(saving){saveTimer=setTimeout(flush,400);return;}
  saving=true; const id=cur,data=stamp(clone(state)); lastJSON=JSON.stringify(data);
  try{await upsert(id,data); offlineDirty=false; clearDirty(); if(!saveTimer) setStatus("saved");}
  catch(e){handleSaveError(e);}
  finally{saving=false;}
}
function handleSaveError(e){
  const code=(e&&e.code)||"",msg=(e&&e.message)||"";
  if(code==="42501"||/row-level security|permission denied/i.test(msg)){readOnly=true;setStatus("ro");render();toast("Tu usuario no tiene permiso para editar.");return;}
  offlineDirty=true; setStatus("offline");
  clearTimeout(retryTimer); retryTimer=setTimeout(()=>{if(!saveTimer)saveTimer=setTimeout(flush,0)},8000);
}
async function flushNow(){ if(saveTimer){clearTimeout(saveTimer);await flush();} }
addEventListener("online",()=>{if(offlineDirty&&!saveTimer)saveTimer=setTimeout(flush,0)});
addEventListener("beforeunload",e=>{if(saveTimer||saving||offlineDirty){e.preventDefault();e.returnValue="";}});
const isEditing=()=>{const a=document.activeElement;return a&&app.contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)};
app.addEventListener("focusout",()=>setTimeout(()=>{if(remotePending&&!isEditing()&&!saveTimer&&!saving){const d=remotePending;remotePending=null;state=normalize(d);render();}},0));

async function loadAll(){
  const {data,error}=await sb.from("planes").select("id,data,updated_at");
  if(error) throw error;
  const next={},meta={}; (data||[]).forEach(r=>{if(/^y\d{4}$/.test(r.id)){next[r.id]=r.data;meta[r.id]=r.updated_at;}});
  return {next,meta};
}
function applyRemote(id,d){
  if(id!==cur){years[id]=d; if(!isEditing()&&(showYears||tab==="graficas"||tab==="tablero")) render(); else renderHeader(); return;}
  if(d&&d._by===SESSION) return;            // our own save coming back
  if(saveTimer||saving||offlineDirty) return; // we have newer local changes
  if(isEditing()){remotePending=d;years[cur]=d;return;}
  years[cur]=d; state=normalize(d); lastJSON=JSON.stringify(d); render(); setStatus(readOnly?"ro":"saved");
}
function subscribe(){
  if(channel) return;
  channel=sb.channel("planes-cambios").on("postgres_changes",{event:"*",schema:"public",table:"planes"},p=>{
    if(p.eventType==="DELETE"){const id=p.old&&p.old.id; if(id&&years[id]){delete years[id]; if(id===cur&&!saveTimer&&!saving){pickAfterDelete();} render();} return;}
    const row=p.new; if(!row||!/^y\d{4}$/.test(row.id)) return; applyRemote(row.id,row.data);
  }).subscribe();
}
// When the tab comes back to the front, reload to catch anything realtime missed.
document.addEventListener("visibilitychange",async()=>{
  if(document.visibilityState!=="visible"||!me||!role) return;
  try{const {next}=await loadAll(); for(const id of Object.keys(years)) if(!(id in next)&&id!==cur) delete years[id]; for(const [id,d] of Object.entries(next)){ const same=JSON.stringify(years[id])===JSON.stringify(d); if(!same) applyRemote(id,d);} }catch(e){}
});
function pickAfterDelete(){const ys=sortedYears().filter(n=>years[yid(n)]); if(ys.length){cur=yid(ys[ys.length-1]);state=normalize(years[cur]);} else {cur=yid(THIS_YEAR);state=normalize(blank(THIS_YEAR));}}

async function openYear(y){
  if(offlineDirty){toast("Sin conexión: espera a que se guarden tus cambios antes de cambiar de año.");renderHeader();return;}
  await flushNow();
  const id=yid(y); if(!years[id]&&id!==cur) return;
  cur=id; state=normalize(years[id]); lastJSON=JSON.stringify(years[id]); qSel=null; histList=null;
  try{localStorage.setItem("pe-year",id)}catch(_){}
  render(); if(showYears) loadHist();
}
async function createYear(){
  if(readOnly){toast("Tu acceso es de solo lectura.");return;}
  const y=+document.getElementById("ny-year").value,from=document.getElementById("ny-from").value,msg=document.getElementById("ny-msg");
  if(!y||y<2000||y>2100){msg.textContent="Escribe un año válido.";return;}
  if(years[yid(y)]){msg.textContent=`El año ${y} ya existe. Ábrelo desde la lista.`;return;}
  await flushNow();
  const src=from?yearData(yid(+from)):null;
  const d=copyForNewYear(src,y); d.ejemplo=false;
  try{await writeDoc(yid(y),d);}catch(e){msg.textContent="No se pudo crear el año. Revisa tu conexión o tu permiso de edición.";return;}
  years[yid(y)]=d; showYears=false; await openYear(y); toast(`Año ${y} creado`);
}
async function toggleClose(y){
  if(readOnly){toast("Tu acceso es de solo lectura.");return;}
  const id=yid(y),d=id===cur?state:normalize(years[id]); d.cerrado=!d.cerrado;
  if(id===cur){state=d;}
  years[id]=clone(d);
  try{await writeDoc(id,years[id]);}catch(e){toast("No se pudo guardar el cambio");}
  if(id===cur) lastJSON=JSON.stringify(years[id]);
  render(); toast(d.cerrado?`Año ${y} cerrado`:`Año ${y} reabierto`);
}
async function deleteYear(y){
  if(readOnly){toast("Tu acceso es de solo lectura.");return;}
  const id=yid(y);
  try{ await removeDoc(id); }catch(e){toast("No se pudo eliminar");return;}
  delete years[id];
  if(id===cur) pickAfterDelete();
  render(); loadHist(); toast(`Año ${y} eliminado. Puedes recuperarlo desde “Años eliminados”.`);
}
async function clearExamples(){
  if(readOnly){toast("Tu acceso es de solo lectura.");return;}
  await flushNow();
  const ids=Object.keys(years).filter(id=>years[id]&&years[id].ejemplo);
  for(const id of ids){ try{ await removeDoc(id); }catch(e){} delete years[id]; }
  if(!years[yid(THIS_YEAR)]){ const d=blank(THIS_YEAR); years[yid(THIS_YEAR)]=d; try{await writeDoc(yid(THIS_YEAR),d);}catch(e){} }
  cur=yid(THIS_YEAR); state=normalize(years[cur]); lastJSON=JSON.stringify(years[cur]); tab="estrategia"; render(); toast(`Plan ${THIS_YEAR} listo. Empieza por la estrategia.`);
}

/* ---- backups, history, import ---- */
function downloadFile(name,text,type){
  const blob=new Blob([text],{type}),a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);
}
function backupAll(){
  const all=clone(years); all[cur]=clone(state);
  const stampDate=new Date().toISOString().slice(0,10);
  downloadFile(`respaldo-plan-estrategico-${stampDate}.json`,JSON.stringify({app:"plan-estrategico",formato:1,exportado:new Date().toISOString(),years:all},null,1),"application/json");
  toast("Respaldo descargado");
}
const fmtDate=s=>{try{return new Date(s).toLocaleString("es-GT",{dateStyle:"medium",timeStyle:"short"})}catch(e){return s}};
async function loadHist(){
  if(!sb) return;
  const a=await sb.from("planes_historial").select("id,plan_id,guardado_en,guardado_por,op").eq("plan_id",cur).order("guardado_en",{ascending:false}).limit(20);
  histList=a.error?[]:a.data||[];
  const b=await sb.from("planes_historial").select("id,plan_id,guardado_en,guardado_por,op").eq("op","DELETE").order("guardado_en",{ascending:false}).limit(30);
  const seen=new Set(); deletedList=(b.error?[]:b.data||[]).filter(h=>!years[h.plan_id]&&!seen.has(h.plan_id)&&seen.add(h.plan_id));
  if(showYears) render();
}
async function restoreVersion(hid){
  if(readOnly){toast("Tu acceso es de solo lectura.");return;}
  const {data,error}=await sb.from("planes_historial").select("plan_id,data").eq("id",hid).single();
  if(error||!data){toast("No se pudo leer esa versión");return;}
  await flushNow();
  const id=data.plan_id,d=clone(data.data);
  try{await writeDoc(id,d);}catch(e){toast("No se pudo restaurar");return;}
  years[id]=d; cur=id; state=normalize(d); lastJSON=JSON.stringify(d); showYears=false;
  render(); toast(`Año ${id.slice(1)} restaurado`);
}
async function handleImportFile(file){
  if(!file) return;
  try{
    const obj=JSON.parse(await file.text());
    let plans={};
    if(obj&&obj.years&&typeof obj.years==="object") plans=obj.years;
    else if(obj&&obj.anio) plans[yid(obj.anio)]=obj;
    const ids=Object.keys(plans).filter(id=>/^y\d{4}$/.test(id)&&plans[id]&&plans[id].anio);
    if(!ids.length){toast("Ese archivo no es un respaldo del plan.");return;}
    pendingImport={plans,ids:ids.sort(),replace:ids.filter(id=>years[id])};
  }catch(e){toast("No se pudo leer el archivo.");return;}
  render();
}
async function confirmImport(){
  if(!pendingImport||readOnly) return;
  await flushNow();
  let ok=0;
  for(const id of pendingImport.ids){ const d=clone(pendingImport.plans[id]); try{await writeDoc(id,d);years[id]=d;ok++;}catch(e){} }
  if(years[cur]){state=normalize(years[cur]);lastJSON=JSON.stringify(years[cur]);}
  else if(pendingImport.ids.length){cur=pendingImport.ids[pendingImport.ids.length-1];state=normalize(years[cur]);}
  pendingImport=null; render(); loadHist(); toast(`${ok} año(s) importado(s)`);
}
function backupSection(){
  const yrs=pendingImport?pendingImport.ids.map(i=>i.slice(1)).join(", "):"";
  return `<div class="sub-head" style="margin-top:22px"><h3>Respaldos</h3><p>Descarga una copia de todos los años en un archivo y guárdala en tu computadora o en Drive. Con ella puedes recuperar todo en cualquier momento.</p></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn" data-act="backup-dl" data-safe="1">Descargar respaldo</button>
    <button class="btn ghost" data-act="csv-dl" data-safe="1">Descargar ${state.anio} en CSV (Excel)</button>
    ${readOnly?"":`<label class="btn ghost" style="cursor:pointer">Importar respaldo…<input type="file" id="imp-file" accept=".json,application/json" hidden></label>`}
  </div>
  ${pendingImport?`<div class="warnbox" style="margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span>El archivo trae: <b>${yrs}</b>. ${pendingImport.replace.length?`Se reemplazarán: <b>${pendingImport.replace.map(i=>i.slice(1)).join(", ")}</b> (la versión actual queda en el historial).`:"No reemplaza ningún año existente."}</span><button class="btn small primary" data-act="import-confirm" data-safe="1">Importar</button><button class="btn small ghost" data-act="import-cancel" data-safe="1">Cancelar</button></div>`:""}
  <div class="sub-head" style="margin-top:22px"><h3>Versiones anteriores de ${state.anio}</h3><p>Se guarda una copia automática cada 15 minutos mientras alguien trabaja, y siempre antes de borrar un año.</p></div>
  ${histList==null?'<p class="hint">Cargando…</p>':histList.length?histList.map(h=>`<div class="yrow"><span style="font-family:var(--f-mono);font-size:13px">${esc(fmtDate(h.guardado_en))}</span><span class="hint">${esc(h.guardado_por||"")}${h.op==="DELETE"?" · antes de eliminar":""}</span><span class="sp"></span>${readOnly?"":`<button class="btn small ghost" data-act="restore" data-h="${h.id}" data-safe="1" data-armed="0">Restaurar</button>`}</div>`).join(""):'<p class="hint">Aún no hay versiones anteriores de este año.</p>'}
  ${deletedList.length?`<div class="sub-head" style="margin-top:22px"><h3>Años eliminados</h3><p>Puedes recuperarlos tal como estaban antes de borrarlos.</p></div>${deletedList.map(h=>`<div class="yrow"><span class="y">${esc(h.plan_id.slice(1))}</span><span class="hint">eliminado el ${esc(fmtDate(h.guardado_en))}${h.guardado_por?` por ${esc(h.guardado_por)}`:""}</span><span class="sp"></span>${readOnly?"":`<button class="btn small" data-act="restore" data-h="${h.id}" data-safe="1" data-armed="0">Recuperar</button>`}</div>`).join("")}`:""}`;
}
document.addEventListener("change",e=>{if(e.target&&e.target.id==="imp-file") handleImportFile(e.target.files[0]);});
document.addEventListener("click",e=>{
  const b=e.target.closest&&e.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act;
  if(a==="backup-dl") backupAll();
  else if(a==="csv-dl") downloadFile(`plan-estrategico-${state.anio}.csv`,"﻿"+toCSV(),"text/csv");
  else if(a==="import-confirm") confirmImport();
  else if(a==="import-cancel"){pendingImport=null;render();}
  else if(a==="restore"){
    if(b.dataset.armed!=="1"){const t=b.textContent;b.dataset.armed="1";b.textContent="¿Confirmar?";setTimeout(()=>{if(b.isConnected){b.dataset.armed="0";b.textContent=t}},4000);return;}
    restoreVersion(+b.dataset.h);
  }
});

/* ---- sign-in gate ---- */
const gate=document.getElementById("gate");
function showGate(mode,info){
  document.body.classList.add("gated"); gate.hidden=false;
  const head=`<h1>Plan estratégico</h1>`;
  const forms={
    config:`${head}<p>Falta conectar el programa con Supabase. Abre el archivo <b>config.js</b> y pega la URL y la clave pública (anon) de tu proyecto, como explica la guía.</p>`,
    login:`${head}<p class="hint">Entra con el correo y la contraseña que te dio el administrador.</p>
      <form id="f-login"><label class="fl"><span>Correo</span><input class="fld" id="g-email" type="email" autocomplete="email" required></label>
      <label class="fl"><span>Contraseña</span><input class="fld" id="g-pass" type="password" autocomplete="current-password" required></label>
      <button class="btn primary" type="submit" style="justify-content:center">Entrar</button>
      <button class="linkbtn" type="button" data-gate="forgot">Olvidé mi contraseña</button></form>`,
    forgot:`${head}<p class="hint">Te enviaremos un correo con un enlace para crear una contraseña nueva.</p>
      <form id="f-forgot"><label class="fl"><span>Correo</span><input class="fld" id="g-email" type="email" autocomplete="email" required></label>
      <button class="btn primary" type="submit" style="justify-content:center">Enviar enlace</button>
      <button class="linkbtn" type="button" data-gate="login">Volver</button></form>`,
    newpass:`${head}<p class="hint">Escribe tu contraseña nueva (mínimo 8 caracteres).</p>
      <form id="f-newpass"><label class="fl"><span>Contraseña nueva</span><input class="fld" id="g-p1" type="password" minlength="8" autocomplete="new-password" required></label>
      <label class="fl"><span>Repite la contraseña</span><input class="fld" id="g-p2" type="password" minlength="8" autocomplete="new-password" required></label>
      <button class="btn primary" type="submit" style="justify-content:center">Guardar contraseña</button></form>`,
    noaccess:`${head}<p>El correo <b>${esc(info||"")}</b> no está en la lista de miembros del plan. Pide al administrador que lo agregue.</p><button class="btn" data-gate="logout">Salir</button>`,
    error:`${head}<p>No se pudo conectar con la base de datos.</p><p class="hint">${esc(info||"")}</p><button class="btn" data-gate="retry">Reintentar</button>`
  };
  gate.innerHTML=`<div class="card">${forms[mode]||forms.login}<p class="hint" id="g-msg" style="margin:10px 0 0;min-height:1.2em"></p></div>`;
  const f=gate.querySelector("input"); if(f) f.focus();
}
function hideGate(){document.body.classList.remove("gated");gate.hidden=true;gate.innerHTML="";}
const gmsg=t=>{const m=document.getElementById("g-msg");if(m)m.textContent=t;};
gate.addEventListener("click",async e=>{
  const b=e.target.closest("[data-gate]"); if(!b) return;
  const g=b.dataset.gate;
  if(g==="logout"){await sb.auth.signOut();showGate("login");}
  else if(g==="retry"){location.reload();}
  else showGate(g);
});
gate.addEventListener("submit",async e=>{
  e.preventDefault();
  const id=e.target.id;
  if(id==="f-login"){
    gmsg("Entrando…");
    const {data,error}=await sb.auth.signInWithPassword({email:document.getElementById("g-email").value.trim(),password:document.getElementById("g-pass").value});
    if(error){gmsg(/invalid/i.test(error.message)?"Correo o contraseña incorrectos.":error.message);return;}
    enter(data.user);
  } else if(id==="f-forgot"){
    const {error}=await sb.auth.resetPasswordForEmail(document.getElementById("g-email").value.trim(),{redirectTo:location.origin+location.pathname});
    gmsg(error?error.message:"Listo. Revisa tu correo y abre el enlace.");
  } else if(id==="f-newpass"){
    const p1=document.getElementById("g-p1").value,p2=document.getElementById("g-p2").value;
    if(p1!==p2){gmsg("Las contraseñas no coinciden.");return;}
    const {data,error}=await sb.auth.updateUser({password:p1});
    if(error){gmsg(error.message);return;}
    history.replaceState(null,"",location.pathname); enter(data.user);
  }
});
document.getElementById("btn-logout").addEventListener("click",async()=>{
  await flushNow();
  if(offlineDirty){toast("Hay cambios sin guardar. Espera a tener conexión antes de salir.");return;}
  if(channel){sb.removeChannel(channel);channel=null;}
  await sb.auth.signOut(); me=null; role=null; years={}; showGate("login");
});

async function enter(user){
  me=user;
  const email=(user.email||"").toLowerCase();
  const {data:m,error:me_err}=await sb.from("miembros").select("rol,nombre").eq("email",email).maybeSingle();
  if(me_err){showGate("error",me_err.message);return;}
  if(!m){showGate("noaccess",email);return;}
  role=m.rol; readOnly=role!=="editor";
  document.getElementById("who").textContent=m.nombre||email;
  hideGate(); setStatus("loading");
  let meta={};
  try{const r=await loadAll(); years=r.next; meta=r.meta;}catch(e){showGate("error",e.message);return;}
  // Recover edits that never reached the server (window closed while offline, etc.)
  try{
    const dirty=JSON.parse(localStorage.getItem("pe-dirty")||"null");
    if(dirty&&dirty.data&&dirty.email===user.email&&!readOnly){
      const serverAt=meta[dirty.id]?Date.parse(meta[dirty.id]):0;
      if(Date.parse(dirty.at)>serverAt){ await writeDoc(dirty.id,clone(dirty.data)); years[dirty.id]=dirty.data; toast("Se recuperaron cambios que no se habían guardado."); }
    }
    clearDirty();
  }catch(e){}
  cur=pickInitial(); state=normalize(years[cur]||blank(+cur.slice(1)));
  lastJSON=JSON.stringify(years[cur]||null);
  render(); setStatus(readOnly?"ro":"saved"); subscribe();
}
function pickInitial(){
  let pref=null; try{pref=localStorage.getItem("pe-year")}catch(_){}
  if(pref&&years[pref]) return pref;
  if(years[yid(THIS_YEAR)]) return yid(THIS_YEAR);
  const ys=Object.keys(years).sort(); return ys.length?ys[ys.length-1]:yid(THIS_YEAR);
}
async function boot(){
  if(!CFG.supabaseUrl||!CFG.supabaseAnonKey||/PEGA_AQUI/.test(CFG.supabaseUrl+CFG.supabaseAnonKey)||!window.supabase){showGate("config");return;}
  sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey);
  let recovering=/type=recovery/.test(location.hash);
  sb.auth.onAuthStateChange(ev=>{ if(ev==="PASSWORD_RECOVERY"){recovering=true;showGate("newpass");} });
  const {data:{session}}=await sb.auth.getSession();
  if(recovering){showGate("newpass");return;}
  if(!session){showGate("login");return;}
  await enter(session.user);
}

function toCSV(){
  const rows=[],q=s=>{s=s==null?"":String(s);return /[",\n;]/.test(s)?`"${s.replace(/"/g,'""')}"`:s},R=(...c)=>rows.push(c.map(q).join(","));
  const d=state,E=d.estrategia,bp=budget(d,"plan"),br=budget(d,"real");
  R("PLAN ESTRATÉGICO",d.anio);R("Empresa",d.empresa.nombre);R("Resumen",d.empresa.resumen);R();
  R("ESTRATEGIA");R("Propósito",E.proposito);R("Valores",E.valores.filter(Boolean).join(" | "));R("BHAG",E.bhag);E.metas35.forEach(m=>R("Meta 3-5 años",m.meta,m.indicador));R("Terreno de juego",E.terreno);R("Estrategia en una frase",E.frase);R("Factor X",E.factorX);R();
  R("FDT","Fortalezas","Debilidades","Tendencias");const mx=Math.max(d.fdt.f.length,d.fdt.d.length,d.fdt.t.length);for(let i=0;i<mx;i++)R("",d.fdt.f[i],d.fdt.d[i],d.fdt.t[i]);R();
  R("OBJETIVOS","Objetivo","Indicador","Meta","Responsable");d.objetivos.forEach((o,i)=>R("O"+(i+1),o.obj,o.indicador,o.meta,o.resp));R();
  R("TRIMESTRES","Tema","Número crítico","Real","Estado");d.trimestres.forEach((t,i)=>R(QL(i),t.tema,t.cn.nombre,t.cn.real,CN_L[cnState(t.cn)]||""));R();
  R("ROCKS","Trimestre","Rock","Dueño","Estado","Objetivo");d.trimestres.forEach((t,i)=>t.rocks.forEach(r=>R("",QL(i),r.t,r.dueno,(ROCK_E.find(x=>x[0]===r.estado)||ROCK_E[0])[1],objLabel(r.o))));R();
  R("KPIs","Unidad",...[0,1,2,3].flatMap(i=>["Meta "+QL(i),"Real "+QL(i)]));d.kpis.forEach(k=>R(k.nombre,k.unidad,...[0,1,2,3].flatMap(i=>[k.meta[i],k.real[i]])));R();
  const B=(l,a,t)=>R(l,...a.map(v=>v==null?"":Math.round(v)),t==null?"":Math.round(t));
  R("PRESUPUESTO PLAN (Q)","T1","T2","T3","T4","Total");d.presupuesto.canales.forEach(c=>B(c.nombre,c.v.map(z),sum(c.v)));B("Ventas totales",bp.ing,bp.T.ing);B("Costo de ventas",bp.cos,bp.T.cos);B("Gastos operativos",bp.gt,bp.T.gt);B("Utilidad operativa",bp.uo,bp.T.uo);R();
  R("RESULTADOS REALES (Q)","T1","T2","T3","T4","Total");d.presupuesto.canales.forEach(c=>B(c.nombre,c.r.map(z),sum(c.r)));B("Ventas totales",br.ing,br.T.ing);B("Costo de ventas",br.cos,br.T.cos);B("Gastos operativos",br.gt,br.T.gt);B("Utilidad operativa",br.uo,br.T.uo);R();
  R("RIESGOS","Trimestre","Impacto","Mitigación","Responsable");d.riesgos.forEach(r=>R(r.riesgo,r.trim,r.impacto,r.mitigacion,r.resp));
  return rows.join("\r\n");
}

boot();
})();
</script>
